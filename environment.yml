name: glacier-offsets
channels: [conda-forge]
dependencies:
  - python=3.12
  - isce3=0.25.21=*_cpu
  - fftw>=3.3
  - compass=0.5.6
  - s1reader=0.2.5
  - numpy=1.26.4
  - scipy=1.12.0
  - gdal=3.13.3
  - h5py=3.16.0
  - pyyaml=6.0.3
  - pyproj=3.8.0
  - shapely>=2.0
  - matplotlib-base=3.10.8
  - pip
  - setuptools
# CUDA requires a supported Linux/NVIDIA ISCE3 build with PyCuAmpcor.
# Replace the *_cpu constraint only on such a host; auto probes hardware at runtime.
