[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glacier-offsets"
version = "0.1.0"
description = "Sentinel-1 radar-coordinate amplitude offset tracking with AOI burst selection"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<2", "scipy>=1.12", "h5py>=3", "PyYAML>=6", "pyproj>=3.6", "shapely>=2.0", "matplotlib>=3.10,<3.11"]

[project.optional-dependencies]
preparation = ["sentineleof", "sardem", "requests>=2"]

[project.scripts]
glacier-offsets = "glacier_offsets.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
glacier_offsets = ["defaults.yaml"]
