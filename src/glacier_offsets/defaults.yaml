# Workflow defaults. Matching arrays are [azimuth, range].
# Local input/output paths, burst ID and geocoding EPSG belong in pair overrides.
inputs:
  polarization: VV
  subswaths: [1, 2, 3]
gross_offsets:
  mode: zero  # zero | constant | velocity; velocity requires explicit source/conventions
  constant:
    azimuth_px: 0
    range_px: 0
burst_merge:
  enabled: true  # AOI workflows assemble coregistered SLCs before matching.
  alignment_tolerance_px: 0.001
storage:
  keep_merged_slcs: false  # Release assembled SLCs after their last matching use; keep per-burst coreg.
  scratch_directory: null  # Optional fast local directory for temporary range-2x matching inputs.
matching:
  engine: isce3  # isce3 | isce2 (actual ISCE2 CPU magnitude Ampcor)
  isce2:
    python: null  # null uses the current interpreter; may point to a separate ISCE2 environment
    packages: null  # optional directory containing the installed isce/isce2 package
    library_path: null  # optional native-library directory, applied only in the ISCE2 child
  backend: auto
  window: [64, 256]
  search: [10, 40]
  stride: [32, 128]
  raw_oversampling: 2
  oversampling: 32
  zoom: 16
  deramp: 1
  range_oversampling: 1  # 1 | 2: interpolate complex SLCs 2x in range before detection (stack CPU, deramp 0)
  batch: [1, 8]
  snr_threshold: 0.0
  correlation_threshold: 0.0
geocoding:
  spacing_m: 200
  resampling: nearest
  mask: input
packaging:
  source: raw  # raw | swath_corrected; package existing completed active pairs only.
  output: null  # null uses <output.directory>/packages/displacements_<source>.nc.
